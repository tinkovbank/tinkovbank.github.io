            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
            text-decoration: none; /* Убирает подчеркивание ссылки */
        }

        /* Эффект при нажатии на обычные кнопки */
