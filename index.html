<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест РСЯ</title>
</head>
<body>

    <h3>Статус рекламы: <span id="ad-status" style="color: blue;">Инициализация...</span></h3>
    
    <!-- Контейнер для рекламы -->
    <div id="yandex-dynamic-container" style="min-height: 90px; background: #f0f0f0; border: 1px dashed #ccc;"></div>

    <!-- Загрузчик Яндекса -->
    <script src="https://yandex.ru/ads/system/context.js" async onerror="document.getElementById('ad-status').innerText='Ошибка: Скрипт Яндекса заблокирован (AdBlock?)'; document.getElementById('ad-status').style.color='red';"></script>

    <script>
        window.yaContextCB = window.yaContextCB || [];
        
        const INTERVAL = 10000; // Увеличили до 10 секунд, чтобы Яндекс успевал ответить
        const BLOCK_ID = 'R-A-19461198-1';

        function refreshYandexAd() {
            const parentContainer = document.getElementById('yandex-dynamic-container');
            const statusNode = document.getElementById('ad-status');
            
            if (!parentContainer) return;

            // Генерируем уникальный ID для контейнера
            const uniqueId = `yandex_rtb_${BLOCK_ID}_${Date.now()}`;
            parentContainer.innerHTML = `<div id="${uniqueId}"></div>`;

            // Проверяем, загрузилась ли библиотека Яндекса
            if (window.Ya && window.Ya.Context && window.Ya.Context.AdvManager) {
                statusNode.innerText = "Запрос отправлен в РСЯ...";
                statusNode.style.color = "orange";

                window.yaContextCB.push(() => {
                    Ya.Context.AdvManager.render({
                        blockId: BLOCK_ID,
                        renderTo: uniqueId,
                        async: true,
                        // Колбэк, который сработает, когда Яндекс ответит
                        onRender: (data) => {
                            statusNode.innerText = "Реклама успешно загружена!";
                            statusNode.style.color = "green";
                            console.log("Реклама отрендерилась:", data);
                        }
                    });
                });
            } else {
                statusNode.innerText = "Ошибка: Скрипт Яндекса не найден в системе (проверьте интернет или AdBlock)";
                statusNode.style.color = "red";
            }
        }

        // Запуск через 2 секунды после открытия, чтобы дать подгрузиться context.js
        setTimeout(() => {
            refreshYandexAd();
            // Цикл обновления
            setInterval(refreshYandexAd, INTERVAL);
        }, 2000);
    </script>

</body>
</html>
