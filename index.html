        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));

        /* Стиль отдельного блока (станции) */
        .card {
            background: #1e1e29;
            border: 2px solid #2e2e3f;
            border-radius: 12px;
            padding: 20px 10px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60px;
            user-select: none;
        }

        /* Эффект при наведении */
        .card:hover {
            border-color: #a855f7;
            transform: translateY(-2px);
            background: #252538;
        }

        /* Стиль активной (играющей) станции */
        .card.active {
            background: #a855f7;
            border-color: #c084fc;
            color: #ffffff;

        .player-bar {

            bottom: 0;
            left: 0;
            right: 0;

            align-items: center;

        }

        .now-playing span {
            color: #a855f7;
        }

        audio {
            width: 100%;
            max-width: 500px;
            outline: none;
        }
    </style>
