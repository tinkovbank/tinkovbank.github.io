    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТВ радио Портал</title>
    <style>
        /* Современный градиентный фон */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); /* Глубокий темно-синий градиент */
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column; /* На мобильных всё идет сверху вниз */
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Общий контейнер, который на ПК выстроит карточку и рекламу в одну строку */
        .page-wrapper {
            display: flex;
            flex-direction: column; /* Мобильный вид: вертикально */
            flex: 1;
            width: 100%;
            gap: 20px;
        }

        /* Контейнер для центрирования карточки */
        .main-content {
            flex: 1; 
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        /* Контейнер с эффектом матового стекла (Glassmorphism) */
        .portal-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px 20px;
            width: 100%;
            max-width: 360px; /* Оптимально для мобильных */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            box-sizing: border-box;
        }

        /* Заголовок внутри карточки */
        .portal-title {
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        /* Сетка для кнопок */
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        /* Стильные мобильные кнопки */
        .btn {
            display: block;
            width: 100%;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08); /* Полупрозрачные стильные кнопки */
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
            text-decoration: none; /* Unlines links */
        }

        /* Эффект при нажатии на обычные кнопки */
        .btn:active {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0.98);
        }

        /* Контейнер для рекламы */
        .ad-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-top: auto; /* Прижимает к низу на мобильных */
        }

        /* Адаптация для планшетов и ПК (экраны шире 900px) */
        @media (min-width: 900px) {
            .page-wrapper {
                flex-direction: row; /* Размещает контент слева, а рекламу СПРАВА */
                align-items: center;
                justify-content: space-between;
                max-width: 1200px; /* Ограничение ширины макета */
                margin: 0 auto;    /* Центрирует всю страницу на экране */
            }

            .main-content {
                justify-content: flex-end; /* Сдвигает карточку ближе к центру/правее */
                padding-right: 50px;       /* Зазор перед рекламой */
            }

            .ad-container {
                width: auto;               /* Реклама занимает только свою ширину */
                margin-top: 0;             /* Отменяем мобильный отступ */
                flex-shrink: 0;            /* Запрещаем рекламе сжиматься */
            }

            .portal-card {
                max-width: 450px;
                padding: 40px;
            }

            .button-container {
                flex-direction: row;
                justify-content: center;
            }

            .btn {
                font-size: 15px;
                padding: 12px 24px;
                width: auto; 
                flex: 1;    
            }
        }
    </style>
</head>
<body>

<!-- Все элементы обернуты в один wrapper -->
<div class="page-wrapper">

    <!-- Основной контент страницы -->
    <div class="main-content">
        <div class="portal-card">
            <h1 class="portal-title">Телерадио Портал</h1>
            
            <div class="button-container">
                <a href="/tv.html" class="btn">Телевидение</a>
                <a href="/radio.html" class="btn">Радио</a>
            </div>
        </div>
    </div>

    <!-- Рекламный блок перемещен внутрь wrapper и обернут в ad-container -->
    <div class="ad-container">
        <!-- Yandex.RTB R-A-19461198-9 -->
        <div id="yandex_rtb_R-A-19461198-9"></div>

            })
        })
        </script>
    </div>

</div>

</body>
</html>
