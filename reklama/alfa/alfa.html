<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
	<meta http-equiv="refresh" content="15">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Продукты Alfa-Bank</title>
    <style>
        {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a; /* Темный фон страницы */
            color: #ffffff;
            overflow-x: hidden;
        }
        header {
            background-color: #111111;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            height: 70px;
        }
        .logo {
            color: #ffdd2d; /* Фирменный желтый */
            font-size: 22px;
            font-weight: 800;
            text-decoration: none;
            letter-spacing: 0.5px;
            z-index: 1001;
        }
        .menu-list {
            display: flex;
            list-style: none;
            gap: 5px;
        }
        .menu-link {
            color: #aaaaaa;
            text-decoration: none;
            padding: 10px 18px;
            font-weight: bold;
            font-size: 15px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }
        .menu-link:hover {
            color: #1a1a1a;
            background-color: #ffdd2d; /* Желтый фон при наведении */
        }
        .menu-toggle {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 26px;
            height: 18px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 1001;
        }
        .menu-toggle span {
            width: 100%;
            height: 2px;
            background-color: #ffffff;
            border-radius: 2px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .menu-toggle.open span:nth-child(1) {
            transform: translateY(8px) rotate(45deg);
        }
        .menu-toggle.open span:nth-child(2) {
            opacity: 0;
        }
        .menu-toggle.open span:nth-child(3) {
            transform: translateY(-8px) rotate(-45deg);
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 998;
        }
        .overlay.active {
            display: block;
        }
        .main-content {
            padding: 40px 10px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #ffffff;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }
        .card-link {
            display: block;
            width: 100%;
            height: 100%;
            text-decoration: none;
        }
        .card-img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            display: block;
        }
        .card-title {
            padding: 10px 5px;
            font-size: 15px;
            font-weight: bold;
            color: #333;
            text-align: center;
        }
        .footer-contacts {
            max-width: 1200px;
            margin: 60px auto 0 auto;
            padding: 40px 10px;
            border-top: 1px solid #333;
            text-align: center;
        }
        .footer-contacts h2 {
            color: #fff;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .contacts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }
        .contact-item {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .contact-icon {
            display: block;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .contact-link {
            color: #ffdd2d;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }
        .contact-link:hover {
            text-decoration: underline;
        }
        .contact-text {
            color: #fff;
            font-size: 18px;
            font-weight: bold;
        }
        .contact-desc {
            color: #aaa;
            font-size: 14px;
            margin-top: 5px;
        }
        .copyright {
            color: #666;
            font-size: 14px;
        }
        @media (max-width: 768px) {
            body.no-scroll {
                overflow: hidden;
            }
            .menu-toggle {
                display: flex;
            }
            .menu-list {
                position: fixed;
                top: 0;
                right: -100%;
                width: 280px;
                height: 100vh;
                background-color: #111111;
                flex-direction: column;
                padding: 100px 25px 30px 25px;
                gap: 15px;
                z-index: 999;
                transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
                box-shadow: -5px 0 25px rgba(0,0,0,0.5);
            }
            .menu-list.active {
                right: 0;
            }
            .menu-link {
                display: block;
                font-size: 18px;
                padding: 12px 15px;
                border-bottom: 1px solid #222;
                border-radius: 0;
            }
            .menu-link:hover {
                background-color: #ffdd2d;
                color: #1a1a1a;
                padding-left: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Шапка с меню из 6 блоков -->

    <!-- Затемнение для мобильного меню -->
    <div class="overlay" id="menu-overlay"></div>

    <!-- Основной контент сайта -->
    <main class="main-content">
        
        <h1>Продукты Alfa-Bank</h1>

                    <img src="/reklama/alfa/akard.png" alt="Карта" class="card-img">
                    <div class="card-title">Альфа-Карта</div>
                </a>
            </div>
            
            <div class="card" id="vklady">
                <a href="https://alfa.me/QjWL8W" target="_blank" class="card-link">
                    <img src="/reklama/alfa/kreditka.png" alt="kreditkard" class="card-img">
                    <div class="card-title">Кредитная Карта</div>
                </a>

            <div class="card" id="job">
                <a href="https://alfa.me/cXDZbG" target="_blank" class="card-link">

                </a>
            </div>
            
            <div class="card" id="invest">
                <a href="https://alfa.me/5uW1wG" target="_blank" class="card-link">
                    <img src="/reklama/alfa/biznes.png" alt="Бизнес-счет" class="card-img">
                    <div class="card-title">Счет для бизнеса</div>
                </a>
            </div>
            
            <div class="card" id="business">
                <a href="https://alfa.me/ElybTG" target="_blank" class="card-link">
                    <img src="/reklama/alfa/bc.png" alt="Бизнес" class="card-img">
                    <div class="card-title">Регистрация бизнеса</div>
                </a>
            </div>
            
        <div class="card">
            <a href="https://alfa.me/mkQtK3" target="_blank" class="card-link">
                <img src="/reklama/alfa/vse.png" alt="Кредит" class="card-img">
                <div class="card-title">Другие продукты</div>
            </a>
        </div>

    </div>


</body>
</html>
