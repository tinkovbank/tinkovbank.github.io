<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест РСЯ</title>
</head>
<body>

    <h3>Статус: <span id="ad-status" style="color: blue;">Ожидание...</span></h3>
    
    <!-- Контейнер для баннера -->
    <div id="yandex-dynamic-container" style="width: 300px; height: 250px; background: #f9f9f9; border: 1px dashed #999;"></div>

    <!-- Загрузчик Яндекса (1 раз на страницу) -->
    <script src="https://yandex.ru/ads/system/context.js" async></script>

    <script>
        window.yaContextCB = window.yaContextCB || [];
        
        const INTERVAL = 5000; // 5 секунд
        // ИСПОЛЬЗУЕМ ТЕСТОВЫЙ ID ЯНДЕКСА (он работает ВЕЗДЕ, даже на file:///)
        const BLOCK_ID = 'R-A-2668388-3'; 

        function refreshYandexAd() {
            const parentContainer = document.getElementById('yandex-dynamic-container');
            const statusNode = document.getElementById('ad-status');
            if (!parentContainer) return;

            // Каждую итерацию создаем уникальный ID под-контейнера
            const uniqueId = `yandex_rtb_${BLOCK_ID}_${Date.now()}`;
            parentContainer.innerHTML = `<div id="${uniqueId}"></div>`;

            if (window.Ya && window.Ya.Context && window.Ya.Context.AdvManager) {
                statusNode.innerText = "Запрос отправлен...";
                statusNode.style.color = "orange";

                window.yaContextCB.push(() => {
                    Ya.Context.AdvManager.render({
                        blockId: BLOCK_ID,
                        renderTo: uniqueId,
                        async: true,
                        onRender: (data) => {
                            statusNode.innerText = `Успешно обновлено! (Продукт: ${data.product})`;
                            statusNode.style.color = "green";
                        },
                        onError: (data) => {
                            statusNode.innerText = `Ошибка РСЯ: ${data.code}`;
                            statusNode.style.color = "red";
                        }
                    });
                });
            } else {
                statusNode.innerText = "Скрипт context.js еще загружается...";
            }
        }

        // Запуск
        setTimeout(() => {
            refreshYandexAd();
            setInterval(refreshYandexAd, INTERVAL);
        }, 1500);
    </script>

</body>
</html>
