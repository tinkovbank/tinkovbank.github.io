<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Плеер и реклама Яндекс In-Image</title>

    <!-- Подключаем jQuery (ваш скрипт) -->
    <script src="/js/jquery.min.js"></script>

    <!-- Главный скрипт Яндекса -->
    <script>window.yaContextCb=window.yaContextCb||[]</script>
    <script src="https://yandex.ru/ads/system/context.js" async></script>

    <style>
        .video-container {
            position: relative;
            width: 640px;  
            height: 360px; 
            margin: 20px auto;
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* Стили для картинки-постера. Она должна перекрывать плеер до клика */
        .video-poster {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
            z-index: 999; 
        }
    </style>
</head>
<body>

<div class="video-container">
    <!-- НАСТОЯЩАЯ КАРТИНКА: На неё Яндекс наложит вашу рекламу In-Image. 
         Замените src на любую вашу картинку-превью, если нужно -->
    <img id="player-poster" class="video-poster" src="/reklama/vtb/vtb.jpg" alt="Превью видео">
    
    <!-- HTML5 ВИДЕОПЛЕЕР (он спрятан под картинкой до клика) -->
    <video id="my-video" controls></video>
</div>

<script>
    // --- 1. НАСТРОЙКА ВИДЕОПОТОКА .m3u8 ---
    const videoSrc = "https://s91030.cdn.ngenix.net/hls/CH_R25_OTT_DV_VLD_TMX/variant.m3u8"; 

    $(document).ready(function() {
        const video = document.getElementById('my-video');
        const poster = $('#player-poster');

        // Обработка клика по картинке через jQuery
        poster.on('click', function() {
            poster.hide(); // Скрываем картинку (и реклама Яндекса на ней тоже закроется)
            
            // Включаем и запускаем видеопоток
            if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(videoSrc);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = videoSrc;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }
        });
    });
</script>

<!-- --- 2. ВАШ ОРИГИНАЛЬНЫЙ КОД ЯНДЕКС.РТБ (ВСТАВЛЕН БЕЗ ИЗМЕНЕНИЙ) --- -->
<!-- Yandex.RTB R-A-19461198-8 -->
<script>
window.addEventListener("load", () => {
    const render = (imageId) => {
        window.yaContextCb.push(() => {
            Ya.Context.AdvManager.render({
                "renderTo": imageId,
                "blockId": "R-A-19461198-8",
                "type": "inImage"
            })
        })
    }
    const renderInImage = (images) => {
        if (!images.length) {
            return
        }
        const image = images.shift()
        image.id = `yandex_rtb_R-A-19461198-8-${Math.random().toString(16).slice(2)}`
        if (image.tagName === "IMG" && !image.complete) {
            image.addEventListener("load", () => {
                render(image.id)
            }, { once: true })
        } else {
            render(image.id)
        }
        renderInImage(images)
    }
    renderInImage(Array.from(document.querySelectorAll("img")))
}, { once: true })
</script>

</body>
</html>
