<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Простой плеер и реклама</title>

    <!-- 1. ПОДКЛЮЧАЕМ JQUERY (ВАШ СКРИПТ) -->
    <script src="/js/jquery.min.js"></script>

    <!-- 2. ПОДКЛЮЧАЕМ ПЛЕЕР ДЛЯ ПОДДЕРЖКИ M3U8 (ИСПРАВЛЕНО: возвращен на место) -->
    <script src="https://cloudflare.com"></script>

    <!-- 3. ГЛАВНЫЙ СКРИПТ ЯНДЕКСА -->
    <script>window.yaContextCb=window.yaContextCb||[]</script>
    <script src="https://yandex.ru/ads/system/context.js" async></script>

    <style>
        .page-container {
            max-width: 640px;
            margin: 20px auto;
            font-family: sans-serif;
        }
        video {
            width: 100%;
            height: 360px;
            background: #000;
            display: block;
        }
        .ads-label {
            font-size: 11px;
            color: #777;
            margin: 10px 0 5px 0;
            text-align: right;
        }
        /* Место под стандартный баннер под плеером */
        .yandex-banner {
            width: 100%;
            min-height: 250px;
            background: #f9f9f9;
            border: 1px dashed #ccc;
        }
    </style>
</head>
<body>

<div class="page-container">

    <!-- ВИДЕОПЛЕЕР (С ВАШЕЙ ССЫЛКОЙ НА ПОСТЕР) -->
    <video id="my-video" controls poster="https://yiimp.hopto.org/"></video>

    <div class="ads-label">Реклама</div>
    
    <!-- МЕСТО ДЛЯ ОТОБРАЖЕНИЯ БАННЕРА ЯНДЕКСА -->
    <div id="yandex_rtb_R-A-19461198-8" class="yandex-banner"></div>

</div>

<script>
    // --- НАСТРОЙКА ВАШЕГО ВИДЕОПОТОКА .m3u8 ---
    const videoSrc = "https://s91030.cdn.ngenix.net/hls/CH_R25_OTT_DV_VLD_TMX/variant.m3u8"; 
    const video = document.getElementById('my-video');

    if (typeof Hls !== 'undefined' && Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(videoSrc);
        hls.attachMedia(video);
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = videoSrc; // Нативная поддержка для Apple Safari (iOS/Mac)
    }

    // --- ПРОСТОЙ И ОШИБОЧНОБЕЗОПАСНЫЙ ВЫЗОВ РЕКЛАМЫ ЯНДЕКСА ---
    // Код изменен с "inImage" на "feed/стандартный", так как на странице больше нет тегов <img>
    window.yaContextCb.push(() => {
        Ya.Context.AdvManager.render({
            "renderTo": "yandex_rtb_R-A-19461198-8",
            "blockId": "R-A-19461198-8"
        })
    });
</script>

</body>
</html>
