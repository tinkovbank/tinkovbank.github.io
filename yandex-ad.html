<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Простой плеер и реклама</title>

    <!-- Подключаем плеер m3u8 (работает везде, кроме jsdelivr) -->
    <script src="/js/jquery.min.js"></script>

    <!-- Главный скрипт Яндекса (подключается один раз в head) -->
    <script>window.yaContextCb=window.yaContextCb||[]</script>
    <script src="https://yandex.ru/ads/system/context.js" async></script>

    <style>
        .page-container {
            max-width: 640px;
            margin: 20px auto;
            font-family: sans-serif;
        }
        video {
            width: 100%;
            background: #000;
        }
        .ads-label {
            font-size: 11px;
            color: #777;
            margin: 10px 0 5px 0;
            text-align: right;
        }
        /* Рамка для рекламы под плеером */
        .yandex-banner {
            width: 100%;
            min-height: 280px; /* Минимальная высота под адаптивный блок */
            background: #f9f9f9;
        }
    </style>
</head>
<body>

<div class="page-container">

    <!-- 1. HTML5 ВИДЕОПЛЕЕР (Запускается сразу по кнопке Play) -->
    <video id="my-video" controls poster="https://unsplash.com"></video>

    <div class="ads-label">Реклама</div>
    
    <!-- 2. МЕСТО ДЛЯ РЕКЛАМЫ ЯНДЕКСА -->
    <div id="yandex_rtb_R-A-19461198-8" class="yandex-banner"></div>

</div>

<script>
    // --- НАСТРОЙКА ВИДЕО .m3u8 ---
    const videoSrc = "https://s91030.cdn.ngenix.net/hls/CH_R25_OTT_DV_VLD_TMX/variant.m3u8"; // Ваша ссылка
    const video = document.getElementById('my-video');

    if (typeof Hls !== 'undefined' && Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(videoSrc);
        hls.attachMedia(video);
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = videoSrc; // Нативная поддержка для Apple Safari
    }

    // --- ПРОСТОЙ ВЫЗОВ РЕКЛАМЫ ЯНДЕКСА ---
    // Этот код просто берет блок из вашего кабинета и вставляет его в div выше
    window.yaContextCb.push(() => {
        Ya.Context.AdvManager.render({
            "renderTo": "yandex_rtb_R-A-19461198-8",
            "blockId": "R-A-19461198-8",
            "type": "feed" 
        })
    })
</script>

</body>
</html>
