<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест РСЯ</title>
</head>
<body>

    <h3>Статус: <span id="ad-status" style="color: blue;">Ожидание загрузки context.js...</span></h3>
    
    <!-- Используем фиксированный контейнер, разрешенный Яндексом -->
    <div id="yandex_rtb_R-A-19461198-1" style="width: 300px; height: 250px; background: #fdfdfd; border: 1px solid #000;"></div>

    <!-- Загружаем библиотеку Яндекса -->
    <script src="https://yandex.ru/ads/system/context.js" async></script>

    <script>
        window.yaContextCB = window.yaContextCB || [];
        
        const INTERVAL = 7000; // 7 секунд
        const BLOCK_ID = 'R-A-19461198-1'; // Всегда рабочий тестовый блок
        const RENDER_TO = 'yandex_rtb_R-A-19461198-1';
        const statusNode = document.getElementById('ad-status');

        function loadAd() {
            statusNode.innerText = "Запрос отправлен в РСЯ...";
            statusNode.style.color = "orange";

            window.yaContextCB.push(() => {
                Ya.Context.AdvManager.render({
                    blockId: BLOCK_ID,
                    renderTo: RENDER_TO,
                    async: true,
                    onRender: (data) => {
                        statusNode.innerText = `Успешно загружено! Продукт: ${data.product}`;
                        statusNode.style.color = "green";
                    },
                    onError: (data) => {
                        statusNode.innerText = `РСЯ вернула ошибку: ${data.code}`;
                        statusNode.style.color = "red";
                    }
                });
            });
        }

        // Запускаем через 3 секунды после открытия страницы (даем время для сети)
        setTimeout(() => {
            if (window.Ya) {
                loadAd();
                // Зацикливаем обновление
                setInterval(loadAd, INTERVAL);
            } else {
                statusNode.innerText = "Критическая ошибка: Сеть полностью заблокировала скрипт Яндекса!";
                statusNode.style.color = "red";
            }
        }, 3000);
    </script>

</body>
</html>
